<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>생일 축하 메시지 남기기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ff00ea;
    --ink: #000000;
    --line: #d9d9d9;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.6;
    padding: 48px 16px 64px;
  }
  main { max-width: 560px; margin: 0 auto; }

  /* 갤러리 */
  .gallery { position: relative; }
  .viewport { position: relative; overflow: hidden; background: var(--bg); touch-action: pan-y; transition: height .4s ease; }
  .track { display: flex; align-items: flex-start; transition: transform .4s ease; }
  .track img {
    flex: 0 0 100%; width: 100%; height: auto; display: block;
    max-height: 80vh; object-fit: contain; /* 세로로 긴 사진이 화면을 넘지 않게 */
    user-select: none; -webkit-user-drag: none;
  }
  .nav {
    position: absolute; top: 50%; transform: translateY(-50%);
    width: 44px; height: 44px; border: 0; background: transparent;
    color: #fff; font-size: 1.6rem; font-weight: 300; cursor: pointer;
  }
  .nav:hover { opacity: .5; }
  .prev { left: 0; } .next { right: 0; }
  .dots { display: flex; justify-content: center; gap: 8px; margin-top: 14px; }
  .dots button {
    width: 6px; height: 6px; padding: 0; border-radius: 50%;
    border: 0; background: rgba(255,255,255,.45); cursor: pointer;
  }
  .dots button[aria-current="true"] { background: #fff; }
  .counter { font-size: .85rem; color: #fff; }
  .nav:focus-visible, .dots button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  .submit:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

  /* 폼 */
  form { margin-top: 48px; }
  label { display: block; color: #fff; font-weight: 500; font-size: .95rem; margin-bottom: 6px; }
  input, textarea {
    width: 100%; font: inherit; color: var(--ink);
    padding: 12px 0; margin-bottom: 28px;
    border: 0; border-bottom: 1px solid var(--ink); border-radius: 0; background: transparent;
  }
  input::placeholder, textarea::placeholder { color: #9a9a9a; }
  textarea { min-height: 120px; resize: vertical; }
  .field { position: relative; margin-bottom: 28px; }
  .field textarea { display: block; margin-bottom: 0; min-height: 210px; color: #fff; border-bottom-color: #fff; }
  .field textarea:focus-visible { outline-color: #fff; }
  .field .art {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: min(300px, 80%); height: auto; pointer-events: none;
    transition: opacity .2s;
  }
  /* 칸을 누르거나 글을 쓰기 시작하면 그림이 사라짐 */
  .field textarea:focus + .art,
  .field textarea:not(:placeholder-shown) + .art { opacity: 0; }
  .submit {
    width: 100%; font: inherit; font-weight: 500;
    padding: 14px; cursor: pointer;
    background: #fff; color: #000; border: 0; border-radius: 0;
  }
  .submit:hover { background: #ffd9fb; }
  .submit:disabled { opacity: .5; cursor: wait; }
  .status { margin-top: 16px; text-align: center; min-height: 1.6em; font-size: .95rem; color: #fff; }
  .status.error { color: #fff; text-decoration: underline; }

  @media (prefers-reduced-motion: reduce) { .track, .viewport { transition: none; } }
</style>

<script>
/* ============================================================
   ① 설정: 여기만 본인 값으로 바꾸세요
   ============================================================ */

// 구글 폼의 "formResponse" 주소 (아래 설명 참고)
const FORM_URL = "https://docs.google.com/forms/d/e/1FAIpQLSdQDUC17a4KW9eXyCnULRNdjrxbJl_6lt7tVfGHlDzrVI4xTQ/formResponse";

// 질문의 entry ID
const ENTRY_MESSAGE  = "entry.1674181253";

// 갤러리 사진 설정
// index.html과 같은 위치에 photos 폴더를 만들고, 사진 이름을 1.jpg, 2.jpg, 3.jpg ... 로 맞춰서 넣으세요.
// 그 다음 사진 개수만 PHOTO_COUNT에 적으면 끝입니다. (예: 사진이 42장이면 42)
const PHOTO_COUNT = 0;      // 0이면 임시 이미지가 나옵니다
const PHOTO_DIR   = "photos/";
const PHOTO_EXT   = "jpg";  // png, jpeg 등 실제 확장자에 맞추세요

// 파일 이름이 제각각이라 숫자로 맞추기 어렵다면, 아래에 직접 적어도 됩니다.
// (PHOTOS에 값이 있으면 위 설정보다 우선합니다)
const PHOTOS = [];

/* ============================================================
   ② 갤러리
   ============================================================ */

// 사진을 아직 안 넣었을 때 보여줄 임시 이미지
function placeholder(n, color) {
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600">
    <rect width="800" height="600" fill="${color}"/>
    <text x="400" y="320" font-size="64" text-anchor="middle" fill="#000" font-family="Apple SD Gothic Neo, sans-serif">사진 ${n}</text></svg>`;
  return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
}
const numbered = Array.from({ length: PHOTO_COUNT }, (_, i) => `${PHOTO_DIR}${i + 1}.${PHOTO_EXT}`);
const photos = PHOTOS.length
  ? PHOTOS
  : PHOTO_COUNT > 0
  ? numbered
  : [placeholder(1, "#f2f2f2"), placeholder(2, "#e4e4e4"), placeholder(3, "#d6d6d6")];

const track = document.getElementById("track");
const dots = document.getElementById("dots");
let index = 0;

photos.forEach((src, i) => {
  const img = document.createElement("img");
  img.loading = "lazy"; img.addEventListener("load", () => { if (track.children[index] === img) fit(); });
  img.src = src; img.alt = `생일 사진 ${i + 1}`; img.draggable = false;
  track.appendChild(img);

  if (photos.length <= 12) {
    const dot = document.createElement("button");
    dot.setAttribute("aria-label", `${i + 1}번째 사진`);
    dot.addEventListener("click", () => go(i));
    dots.appendChild(dot);
  }
});
const counter = document.createElement("span");
counter.className = "counter";
if (photos.length > 12) dots.appendChild(counter);

const vpEl = document.getElementById("viewport");
function fit() {
  const h = track.children[index].getBoundingClientRect().height;
  if (h > 0) vpEl.style.height = h + "px";
}
window.addEventListener("resize", fit);

function go(i) {
  index = (i + photos.length) % photos.length;
  // 이웃 사진 미리 불러오기
  [index - 1, index, index + 1].forEach(k => { const im = track.children[(k + photos.length) % photos.length]; if (im) im.loading = "eager"; });
  fit();
  track.style.transform = `translateX(-${index * 100}%)`;
  [...dots.children].forEach((d, k) => d.setAttribute("aria-current", k === index));
  counter.textContent = `${index + 1} / ${photos.length}`;
}
document.getElementById("prev").onclick = () => go(index - 1);
document.getElementById("next").onclick = () => go(index + 1);
document.addEventListener("keydown", e => {
  if (e.target.matches("input, textarea")) return;
  if (e.key === "ArrowLeft") go(index - 1);
  if (e.key === "ArrowRight") go(index + 1);
});

// 모바일 스와이프
let startX = null;
const vp = document.getElementById("viewport");
vp.addEventListener("touchstart", e => startX = e.touches[0].clientX, { passive: true });
vp.addEventListener("touchend", e => {
  if (startX === null) return;
  const dx = e.changedTouches[0].clientX - startX;
  if (Math.abs(dx) > 40) go(index + (dx < 0 ? 1 : -1));
  startX = null;
});
go(0);

/* ============================================================
   ③ 구글 폼으로 전송 → 스프레드시트에 한 줄씩 쌓임
   ============================================================ */
const form = document.getElementById("wishForm");
const btn = document.getElementById("submitBtn");
const status = document.getElementById("status");

form.addEventListener("submit", async e => {
  e.preventDefault();
  btn.disabled = true;
  status.className = "status";
  status.textContent = "보내는 중…";

  const data = new FormData();
  data.append(ENTRY_MESSAGE, document.getElementById("message").value.trim());

  try {
    // 구글 폼은 CORS 응답을 주지 않아 no-cors로 보냅니다.
    // 응답 내용은 읽을 수 없지만, 전송 자체는 정상적으로 됩니다.
    await fetch(FORM_URL, { method: "POST", mode: "no-cors", body: data });
    status.textContent = "친구의 베프정돈 내 친구와 다름없잖아! 축하 고마워 ><";
    form.reset();
  } catch (err) {
    status.className = "status error";
    status.textContent = "전송에 실패했어요. 인터넷 연결을 확인하고 다시 눌러주세요.";
  } finally {
    btn.disabled = false;
  }
});
</script>
